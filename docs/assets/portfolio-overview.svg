<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Music Data Mining portfolio overview</title>
  <desc id="desc">A portfolio overview showing five labs connected into a music data mining pipeline: signal, features, algorithms, models and generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="0.48" stop-color="#edf5f1"/>
      <stop offset="1" stop-color="#f8eef0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2520" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 58px Inter, Arial, sans-serif; fill: #1f2520; }
      .subtitle { font: 400 24px Inter, Arial, sans-serif; fill: #667064; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #1f2520; }
      .small { font: 400 15px Inter, Arial, sans-serif; fill: #667064; }
      .metric { font: 700 38px Inter, Arial, sans-serif; fill: #1f2520; }
      .metric-label { font: 400 15px Inter, Arial, sans-serif; fill: #667064; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <path d="M76 430 C 170 230, 290 480, 390 290 S 612 260, 718 368 S 930 450, 1088 260" fill="none" stroke="#2f6f58" stroke-width="5" stroke-linecap="round" opacity="0.38"/>
  <path d="M80 455 C 170 515, 254 330, 356 385 S 554 535, 668 310 S 910 225, 1090 350" fill="none" stroke="#b84f62" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <text class="title" x="72" y="100">Music Data Mining</text>
  <text class="subtitle" x="76" y="144">Signal processing -> acoustic features -> ML/DL -> generation</text>

  <g transform="translate(78 194)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="188" height="190" rx="18" fill="#ffffff"/>
      <rect x="0" y="0" width="188" height="9" rx="4" fill="#2f6f58"/>
    </g>
    <text class="label" x="18" y="48">Lab 1</text>
    <text class="small" x="18" y="78">Audio signal</text>
    <text class="small" x="18" y="102">WAV, MIDI</text>
    <text class="small" x="18" y="126">harmonics</text>
    <circle cx="146" cy="145" r="22" fill="#2f6f58" opacity="0.18"/>
    <path d="M128 146 C 136 128, 154 164, 164 144" fill="none" stroke="#2f6f58" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(286 194)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="188" height="190" rx="18" fill="#ffffff"/>
      <rect x="0" y="0" width="188" height="9" rx="4" fill="#167782"/>
    </g>
    <text class="label" x="18" y="48">Lab 2</text>
    <text class="small" x="18" y="78">Spectrograms</text>
    <text class="small" x="18" y="102">MFCC</text>
    <text class="small" x="18" y="126">pitch detection</text>
    <rect x="124" y="126" width="10" height="34" rx="4" fill="#167782" opacity="0.85"/>
    <rect x="140" y="110" width="10" height="50" rx="4" fill="#167782" opacity="0.6"/>
    <rect x="156" y="136" width="10" height="24" rx="4" fill="#167782" opacity="0.35"/>
  </g>

  <g transform="translate(494 194)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="188" height="190" rx="18" fill="#ffffff"/>
      <rect x="0" y="0" width="188" height="9" rx="4" fill="#496da8"/>
    </g>
    <text class="label" x="18" y="48">Lab 3</text>
    <text class="small" x="18" y="78">GTZAN</text>
    <text class="small" x="18" y="102">openSMILE</text>
    <text class="small" x="18" y="126">SVM, PCA</text>
    <circle cx="132" cy="138" r="9" fill="#496da8"/>
    <circle cx="158" cy="122" r="9" fill="#496da8" opacity="0.72"/>
    <circle cx="150" cy="154" r="9" fill="#496da8" opacity="0.45"/>
  </g>

  <g transform="translate(702 194)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="188" height="190" rx="18" fill="#ffffff"/>
      <rect x="0" y="0" width="188" height="9" rx="4" fill="#b84f62"/>
    </g>
    <text class="label" x="18" y="48">Lab 4</text>
    <text class="small" x="18" y="78">Onsets</text>
    <text class="small" x="18" y="102">beat tracking</text>
    <text class="small" x="18" y="126">Pop2Piano</text>
    <path d="M126 152 L126 112 L158 104 L158 144" fill="none" stroke="#b84f62" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="154" r="10" fill="#b84f62" opacity="0.75"/>
    <circle cx="152" cy="146" r="10" fill="#b84f62" opacity="0.45"/>
  </g>

  <g transform="translate(910 194)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="188" height="190" rx="18" fill="#ffffff"/>
      <rect x="0" y="0" width="188" height="9" rx="4" fill="#bc7a25"/>
    </g>
    <text class="label" x="18" y="48">Lab 5</text>
    <text class="small" x="18" y="78">PyTorch MLP</text>
    <text class="small" x="18" y="102">metrics</text>
    <text class="small" x="18" y="126">checkpoints</text>
    <path d="M122 148 L144 116 L168 148 Z" fill="#bc7a25" opacity="0.25"/>
    <circle cx="122" cy="148" r="7" fill="#bc7a25"/>
    <circle cx="144" cy="116" r="7" fill="#bc7a25"/>
    <circle cx="168" cy="148" r="7" fill="#bc7a25"/>
  </g>

  <g transform="translate(78 448)">
    <rect x="0" y="0" width="247" height="98" rx="18" fill="#ffffff" opacity="0.88"/>
    <text class="metric" x="22" y="48">5</text>
    <text class="metric-label" x="22" y="74">labs in one AI/MIR case</text>
  </g>
  <g transform="translate(350 448)">
    <rect x="0" y="0" width="247" height="98" rx="18" fill="#ffffff" opacity="0.88"/>
    <text class="metric" x="22" y="48">10</text>
    <text class="metric-label" x="22" y="74">GTZAN music genres</text>
  </g>
  <g transform="translate(622 448)">
    <rect x="0" y="0" width="247" height="98" rx="18" fill="#ffffff" opacity="0.88"/>
    <text class="metric" x="22" y="48">400</text>
    <text class="metric-label" x="22" y="74">PCA components, about 0.95 variance</text>
  </g>
  <g transform="translate(894 448)">
    <rect x="0" y="0" width="247" height="98" rx="18" fill="#ffffff" opacity="0.88"/>
    <text class="metric" x="22" y="48">21</text>
    <text class="metric-label" x="22" y="74">generated Pop2Piano MIDI files</text>
  </g>
</svg>
